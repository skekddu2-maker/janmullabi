<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>솔이의 빈티지 연식 판별 챗봇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { background-color: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
        header { background-color: #1e1e1e; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; color: #fff; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; word-break: break-word; }
        .user-message { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #2a2a2a; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #3d3d3d; white-space: pre-wrap; }
        #input-container { background-color: #1e1e1e; padding: 10px 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #333; }
        #image-preview-container { position: relative; display: none; align-items: center; }
        #image-preview { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #555; }
        #remove-image { position: absolute; top: -6px; right: -6px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #user-input { flex: 1; background-color: #2a2a2a; border: 1px solid #444; border-radius: 20px; padding: 10px 15px; color: white; font-size: 14px; outline: none; }
        #user-input:focus { border-color: #3b82f6; }
        .upload-btn-label, #send-btn { background-color: #3b82f6; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: background 0.2s; flex-shrink: 0; }
        .upload-btn-label:hover, #send-btn:hover { background-color: #2563eb; }
        #image-input { display: none; }
        #api-key-box { background: #1e1e1e; padding: 10px 15px; border-bottom: 1px solid #333; display: flex; gap: 10px; align-items: center; font-size: 13px; }
        #api-key-input { flex: 1; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; padding: 6px 10px; color: white; outline: none; }
        #save-key-btn { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>🧥 솔이의 빈티지 연식 판별 챗봇</header>

    <div id="api-key-box">
        <span>Gemini API Key:</span>
        <input type="password" id="api-key-input" placeholder="AI Studio에서 받은 키를 입력하세요">
        <button id="save-key-btn">저장</button>
    </div>

    <div id="chat-container">
        <div class="message ai-message">안녕하세요! 상단에 Gemini API 키를 입력하시고 저장한 뒤, 빈티지 의류 사진이나 질문을 남겨주세요! 🕵️‍♂️</div>
    </div>

    <div id="input-container">
        <label for="image-input" class="upload-btn-label" title="사진 업로드">📷</label>
        <input type="file" id="image-input" accept="image/*">
        
        <div id="image-preview-container">
            <img id="image-preview" src="" alt="미리보기">
            <button id="remove-image">✕</button>
        </div>

        <input type="text" id="user-input" placeholder="궁금한 점을 물어보세요 (예: 60년대 지퍼 연식 분석해줘)">
        <button id="send-btn">전송</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const imageInput = document.getElementById('image-input');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const removeImageBtn = document.getElementById('remove-image');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveKeyBtn = document.getElementById('save-key-btn');

        const savedKey = localStorage.getItem('GEMINI_API_KEY');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('GEMINI_API_KEY', key);
                alert('API 키가 저장되었습니다!');
            } else {
                alert('API 키를 입력해주세요.');
            }
        });

        let selectedBase64Image = null;
        let selectedMimeType = null;

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedMimeType = file.type;
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedBase64Image = event.target.result.split(',')[1];
                    imagePreview.src = event.target.result;
                    imagePreviewContainer.style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            imageInput.value = '';
            selectedBase64Image = null;
            selectedMimeType = null;
            imagePreviewContainer.style.display = 'none';
        });

        async function handleSendMessage() {
            const apiKey = localStorage.getItem('GEMINI_API_KEY') || apiKeyInput.value.trim();
            if (!apiKey) {
                alert('먼저 상단에 Gemini API 키를 입력하고 [저장]을 눌러주세요!');
                return;
            }

            const text = userInput.value.trim();
            if (!text && !selectedBase64Image) return;

            let userHtml = '';
            if (selectedBase64Image) {
                userHtml += `<img src="data:${selectedMimeType};base64,${selectedBase64Image}" style="max-width:150px; border-radius:8px; display:block; margin-bottom:5px;">`;
            }
            if (text) {
                userHtml += `<span>${text}</span>`;
            }

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.innerHTML = userHtml;
            chatContainer.appendChild(userMsgDiv);

            const currentImage = selectedBase64Image;
            const currentMime = selectedMimeType;

            userInput.value = '';
            imageInput.value = '';
            selectedBase64Image = null;
            selectedMimeType = null;
            imagePreviewContainer.style.display = 'none';
            imagePreviewContainer.style.display = 'none';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.innerText = '빈티지 아이템을 정밀 분석 중입니다... 🕵️‍♂️';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 최신 모델명(gemini-3.6-flash)으로 직접 통신
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

                let parts = [];
                if (currentImage) {
                    parts.push({
                        inlineData: {
                            mimeType: currentMime || "image/jpeg",
                            data: currentImage
                        }
                    });
                }
                parts.push({
                    text: (text || "이 아이템을 분석해주세요.") + "\n\n당신은 세계적인 빈티지 의류, 밀리터리 및 소품 전문가입니다. 라벨, 지퍼/하드웨어, 원단감 등을 바탕으로 예상 연식, 브랜드, 상세 디테일 근거를 완벽하게 분석해주세요."
                });

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || "분석 결과를 받아오지 못했습니다.";
                aiMsgDiv.innerText = resultText;
            } catch (error) {
                aiMsgDiv.innerText = '⚠️ 오류 발생: ' + error.message;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
