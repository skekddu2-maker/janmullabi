<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>솔이의 빈티지 연식 판별기 (Vintage Era Identifier)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #f3f4f6;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #f3f4f6;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        label {
            font-size: 0.9rem;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #d1d5db;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #f3f4f6;
            border-radius: 6px;
            outline: none;
            margin-bottom: 10px;
        }
        input::placeholder, textarea::placeholder { color: #6b7280; }
        
        .file-upload-label {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #262626;
            border: 1px dashed #555;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #9ca3af;
            margin-bottom: 10px;
        }
        .file-upload-label:hover { background-color: #333; color: #fff; }
        input[type="file"] { display: none; }

        .preview-container {
            width: 100%;
            max-height: 250px;
            overflow: hidden;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
            background: #000;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #059669;
            color: white;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .action-btn:hover { background-color: #047857; }
        .action-btn:disabled { background-color: #374151; color: #6b7280; cursor: not-allowed; }

        .result-box {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.5;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧥 솔이의 빈티지 연식 판별기</h1>
    
    <div class="card">
        <label>Gemini API 키 입력</label>
        <input type="password" id="apiKeyInput" placeholder="AI Studio에서 발급받은 API 키를 입력하세요">
        <p style="font-size: 0.75rem; color: #9ca3af; margin-top: -4px;">* 키는 브라우저에만 저장되며 외부로 유출되지 않습니다.</p>
    </div>

    <div class="card">
        <label>빈티지 아이템 사진 업로드</label>
        <label class="file-upload-label" for="fileInput">📷 사진 선택하기 (라벨, 지퍼, 원단 등)</label>
        <input type="file" id="fileInput" accept="image/*">
        
        <div class="preview-container" id="previewBox">
            <img id="imagePreview" src="" alt="미리보기">
        </div>

        <button class="action-btn" id="analyzeBtn" onclick="analyzeImage()" disabled>연식 및 디테일 분석 시작</button>
    </div>

    <div class="result-box" id="resultBox"></div>
</div>

<script>
    let base64Image = null;
    let mimeType = null;

    const fileInput = document.getElementById('fileInput');
    const previewBox = document.getElementById('previewBox');
    const imagePreview = document.getElementById('imagePreview');
    const analyzeBtn = document.getElementById('analyzeBtn');

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        mimeType = file.type;
        const reader = new FileReader();
        reader.onload = (uploadEvent) => {
            base64Image = uploadEvent.target.result.split(',')[1];
            imagePreview.src = uploadEvent.target.result;
            previewBox.style.display = 'block';
            checkReady();
        };
        reader.readAsDataURL(file);
    };

    document.getElementById('apiKeyInput').oninput = checkReady;

    function checkReady() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        if (apiKey && base64Image) {
            analyzeBtn.disabled = false;
        } else {
            analyzeBtn.disabled = true;
        }
    }

    async function analyzeImage() {
        const apiKey = document.getElementById('apiKeyInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!apiKey || !base64Image) return;

        analyzeBtn.disabled = true;
        analyzeBtn.innerText = "분석 중입니다... 🧐";
        resultBox.style.display = 'block';
        resultBox.innerText = "사진의 라벨, 하드웨어, 원단 디테일을 꼼꼼히 분석하는 중입니다. 잠시만 기다려주세요!";

        const promptText = "당신은 세계적인 빈티지 의류 및 밀리터리 기어, 빈티지 시계/안경 전문가입니다. 업로드된 사진을 면밀히 분석해주세요. 다음 항목들을 포함하여 상세히 설명해주세요:\n1. 예상 연식 (또는 제작 시기)\n2. 브랜드, 모델명 또는 출처 (군복, 복각 브랜드 등)\n3. 핵심 디테일 분석 (라벨 폰트, 지퍼 종류(TALON, RAPID 등), 스냅 버튼, 원단 직조감(HBT 등), 스티치 색상 등 근거가 되는 특징)\n4. 기타 흥미로운 빈티지적 가치나 특징";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            {
                                inline_data: {
                                    mime_type: mimeType,
                                    data: base64Image
                                }
                            }
                        ]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                resultBox.innerText = "에러 발생: " + data.error.message;
            } else {
                const text = data.candidates[0].content.parts[0].text;
                resultBox.innerText = text;
            }
        } catch (err) {
            resultBox.innerText = "통신 중 오류가 발생했습니다: " + err.message;
        } finally {
            analyzeBtn.disabled = false;
            analyzeBtn.innerText = "연식 및 디테일 분석 시작";
        }
    }
</script>

</body>
</html>
